[tools]
ripgrep = "15.2.0"
python = "3.15.2"
neovim = "0.12.6"
lazygit = "0.66.3"
jq = "1.8.2"
fd = "10.5.2"
fzf = "0.75.0"
node = "26.13.1"
bun = "1.4.4"
tmux = "3.8"
tree-sitter = "0.27.2"
gh = "2.104.0"
pi = "1.5.2"
codex = "0.169.0"
claude = "2.1.325"
opencode = { version = "2.3.0", allow_builds = ["@opencode/cli"] }
glow = "3.0.0"
dprint = "0.64.3"
btop = "1.4.8"
bat = "0.26.1"
ttyd = "1.7.7"
ast-grep = "0.51.2"
nono = "0.81.0"

[settings]
# Install Python only from precompiled (python-build-standalone) builds. The
# image lacks the -dev libraries a source build needs, so a fallback compile
# just fails late at ensurepip; fail fast instead when a pin has no prebuilt.
python.compile = false
