[tools]
ripgrep = "16.0.0"
python = "3.15.2"
neovim = "0.12.6"
lazygit = "0.66.3"
jq = "1.8.2"
fd = "10.5.2"
fzf = "0.75.0"
node = "26.13.1"
bun = "1.4.5"
tmux = "3.8"
tree-sitter = "0.27.2"
gh = "2.106.0"
pi = "1.7.0"
codex = "0.172.0"
claude = "2.1.332"
opencode = { version = "2.4.2", allow_builds = ["@opencode/cli"] }
glow = "3.0.0"
dprint = "0.65.0"
btop = "1.4.8"
bat = "0.26.1"
ttyd = "1.7.7"
ast-grep = "0.51.3"
nono = "0.82.0"

[settings]
# Install Python only from precompiled (python-build-standalone) builds. The
# image lacks the -dev libraries a source build needs, so a fallback compile
# just fails late at ensurepip; fail fast instead when a pin has no prebuilt.
python.compile = false
