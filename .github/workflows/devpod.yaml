name: DevPod

# Reusable. Called by check.yaml on pull requests, and by base.yaml as the gate
# in front of the GHCR push, so a commit that cannot `devpod up` is never
# published. Can also be run on its own from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Built and validated on the runner only; never pushed.
  IMAGE: dev:ci
  # loft-sh currently only tags prereleases, so the `latest` download URL still
  # resolves to the stale v0.6.15. Pin explicitly and bump deliberately.
  DEVPOD_VERSION: v0.7.0-alpha.34

jobs:
  devpod:
    name: devpod up (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      # The legs fail for unrelated reasons, so let all of them report.
      fail-fast: false
      matrix:
        # Both architectures of the published manifest, on native runners:
        # emulating an arm64 `mise install` under QEMU would take far longer
        # than it takes to boot a real arm64 runner. Free for public repos.
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile's `mise install` keeps downloaded archives in BuildKit
      # cache mounts, which a fresh runner doesn't have. Restore them from the
      # Actions cache, falling back to the previous config's entry on a bump so
      # only the bumped tool downloads.
      - name: Restore BuildKit cache mounts
        id: mounts-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/buildkit-mounts
          key: buildkit-mounts-${{ matrix.arch }}-${{ hashFiles('.config/mise/config.toml') }}
          restore-keys: buildkit-mounts-${{ matrix.arch }}-

      # Injects the restored dirs into the mounts before the build, and (post
      # step, which runs before actions/cache saves) extracts them after.
      # The ids and targets must match the RUN --mount flags in base/Dockerfile.
      - name: Inject BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          skip-extraction: ${{ steps.mounts-cache.outputs.cache-hit }}
          cache-map: |
            {
              "${{ runner.temp }}/buildkit-mounts/mise-downloads": {
                "target": "/home/dev/.local/share/mise/downloads",
                "id": "mise-downloads-${{ matrix.arch }}", "uid": "1000", "gid": "1000"
              },
              "${{ runner.temp }}/buildkit-mounts/mise-cache": {
                "target": "/home/dev/.cache/mise",
                "id": "mise-cache-${{ matrix.arch }}", "uid": "1000", "gid": "1000"
              },
              "${{ runner.temp }}/buildkit-mounts/npm": {
                "target": "/home/dev/.npm",
                "id": "npm-${{ matrix.arch }}", "uid": "1000", "gid": "1000"
              }
            }

      # Single-platform and `load`ed, because a multi-arch manifest cannot be
      # imported into the runner's docker. Each arch caches under its own scope;
      # base.yaml's push reads both, so it builds neither from scratch.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./base/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          # Authenticates mise's GitHub API calls (60 req/hour unauthenticated).
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Install DevPod
        run: |
          sudo curl -fsSL -o /usr/local/bin/devpod \
            "https://github.com/loft-sh/devpod/releases/download/${DEVPOD_VERSION}/devpod-linux-${{ matrix.arch }}"
          sudo chmod +x /usr/local/bin/devpod
          devpod version

      # `provider add` exits 1 if the provider is already configured (it is not
      # idempotent), which a hosted runner never hits but a reused ~/.devpod
      # would. `provider use` is idempotent, so fall back to it.
      - name: Add docker provider
        run: devpod provider add docker || devpod provider use docker

      # Brings up a throwaway workspace on the image, runs post-create.sh, and
      # asserts the toolchain works. See scripts/validate-devpod.sh.
      - name: Validate devpod up
        env:
          # Asserted inside the container, so a mis-wired matrix cannot pass by
          # validating the wrong architecture.
          EXPECT_ARCH: ${{ matrix.arch }}
        run: scripts/validate-devpod.sh "${IMAGE}"
