model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "low"
service_tier = "standard"

sandbox_mode = "danger-full-access"
approval_policy = "never"

web_search = "cached"
personality = "pragmatic"

[features]
memories = true

[marketplaces.superpowers-dev]
source_type = "git"
source = "https://github.com/obra/superpowers.git"

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[marketplaces.devkit-marketplace]
source_type = "git"
source = "https://github.com/rahulmutt/devkit.git"

[marketplaces.impeccable]
source_type = "git"
source = "https://github.com/pbakaus/impeccable.git"

[plugins."superpowers@superpowers-dev"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[plugins."devkit@devkit-marketplace"]
enabled = true

[plugins."impeccable@impeccable"]
enabled = true
